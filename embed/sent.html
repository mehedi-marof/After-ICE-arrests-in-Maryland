<script>window.STEPS=[{"text": "<b>Most were sent to their own countries.</b> From Jan. 20, 2025, through early August 2026, ICE recorded 6,084 departures of people arrested in Maryland, including about 4,450 deportations and about 1,600 voluntary departures. Guatemala, El Salvador, Mexico and Honduras received the most. Circles are sized by recorded departures.", "legend": "<span><i style=\"background:#1979b9\"></i>Destination country</span>", "globe": false}, {"text": "<b>271 went somewhere else.</b> They were sent to a country other than the one ICE lists as their citizenship. 191 went to Mexico, most of them citizens of El Salvador, Guatemala or Honduras; 154 of the 271 had no prior conviction or pending charge.", "legend": "", "globe": true}, {"text": "<b>A few crossed an ocean.</b> A handful of West Africans were sent to other West African countries, such as five Nigerians sent to Ghana. Destinations are as ICE recorded them, which can be where a flight landed rather than where someone settled.", "legend": "", "globe": true}];</script>
