<script>window.STEPS=[{"text": "<b>Most people start in a hold room.</b> Usually in <b>Baltimore</b>, where 5,625 people arrested in Maryland were booked first, or <b>Salisbury</b>, where 1,836 were. Most of those who started in Salisbury, 1,616, were then moved to Baltimore.", "legend": "<span><i style=\"background:var(--ink)\"></i>Maryland facility</span>", "globe": false}, {"text": "<b>Then many are moved south.</b> More than half, 4,607 people, were held at some point in Louisiana, including 1,905 who passed through the Alexandria Staging Facility, the airport hub ICE uses for deportation flights. About nine in 10 spent the longest part of their detention outside Maryland.", "legend": "<span><i style=\"background:var(--red)\"></i>Facility outside Maryland</span>", "globe": false}, {"text": "<b>The most common recorded route had just two stops.</b> 360 people went from the Baltimore hold room straight to Richwood Correctional Center in Monroe, La. The typical person passed through three facilities.", "legend": "<span><i style=\"background:var(--blue)\"></i>Path</span>", "globe": false}, {"text": "<b>Some journeys were much longer.</b> 1,613 people, about one in five, were held in five or more different facilities. Here is the most common of those longer routes, followed by 25 people. It starts, like most, in the <b>Baltimore hold room</b>, typically for about a day.", "legend": "<span><i style=\"background:var(--blue)\"></i>The route, stop by stop</span>", "globe": false}, {"text": "<b>Stops 2 and 3: Virginia.</b> First the Caroline Detention Facility in Bowling Green, typically for about a day and a half, then ICE's Richmond hold room for a few hours before a long transfer.", "legend": "", "globe": false}, {"text": "<b>Stop 4: Winn Correctional Center, Winnfield, La.</b> More than 1,000 miles from Baltimore. The longest stop on this path, typically about three and a half days.", "legend": "", "globe": false}, {"text": "<b>Stop 5: the Alexandria Staging Facility.</b> The deportation-flight hub. The whole trip typically took about nine and a half days. ICE recorded all 25 as deported. 16 of them had no prior conviction or pending charge.", "legend": "", "globe": false}];</script>
